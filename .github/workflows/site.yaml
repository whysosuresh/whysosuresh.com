# The site's one workflow. `check` runs the type check, the site tests and wrangler's dry run on every
# pull request and on main, holding no key; main's ruleset requires it. On main, `deploy` then puts
# site/ on the Worker whysosuresh-com, with a key from the environment `production`, which only main
# may use. The key can deploy that one Worker and nothing else. The deploy job checks out only what
# the deploy reads and installs only the wrangler pinned in deploy/, so none of the check tools runs
# beside the key.

name: site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install the check tools
        run: npm ci --no-audit --no-fund

      - name: Install wrangler
        run: npm ci --no-audit --no-fund --prefix deploy

      - name: Check
        run: npm run check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://whysosuresh.com
    concurrency:
      # A deploy is never cut short: a newer merge waits, then deploys its own commit.
      group: deploy
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout what the deploy reads
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            wrangler.jsonc
            site
            deploy
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install wrangler
        working-directory: deploy
        run: npm ci --no-audit --no-fund

      - name: Deploy whysosuresh-com
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/wrangler deploy --config ../wrangler.jsonc --message "main ${GITHUB_SHA::12}"
