<!DOCTYPE html>
<!-- whysosuresh.com/threads: Suresh's threads, the page the Worker hands over at /threads/ and at every thread's
     own address, /threads/42 (src/pages.ts). Today (new notes, and what sat a week), the threads list (four tabs
     and the spaces), and a thread: its living summary on top, its main text, then comments and history in order.
     /app/threads.js draws all of it from the threads' private calls under /threads/api/, behind Cloudflare Access;
     the page itself holds no data. Until a call answers, nothing shows: a visitor who isn't signed in sees the
     same "Nothing here" a missing thread shows at a thread's address, and a small "Sign in" there only on a device that
     has signed in before; at /threads/ itself, which names no thread, it always offers "Sign in". A person Suresh
     invited to a thread gets the same page, drawn for them: their threads, and each with a comment box. A thread
     Suresh made public is drawn for anyone who isn't in it in the public view below: the thread, the comments he
     made public, and a note form whose note waits for his OK.
     Every link and file is root-absolute; the icons are a template the script copies. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Threads · whysosuresh.com</title>
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app/threads.js"></script>
</head>
<body class="threads">
  <div class="t-app" data-app hidden>
    <nav class="t-side" aria-label="Threads">
      <div class="t-side-head"><span class="t-brand">Threads</span><a class="t-site" href="/">whysosuresh.com</a></div>
      <button type="button" class="t-side-find" data-act="find"><span data-icon="search"></span>Find anything<kbd>⌘K</kbd></button>
      <div class="t-nav" data-nav></div>
      <button type="button" class="t-side-new" data-act="new"><span data-icon="plus"></span>New thread<kbd>N</kbd></button>
      <div class="t-side-foot"><span class="t-av t-av-me">S</span><span class="t-side-who">Suresh<small>Signed in</small></span><button type="button" class="t-icon-button" data-act="keys" aria-label="Keys"><span data-icon="keys"></span></button></div>
    </nav>
    <div class="t-main" data-main tabindex="-1"></div>
    <nav class="t-tabbar" aria-label="Sections" data-tabbar>
      <button type="button" data-go="today"><span data-icon="sun"></span>Today</button>
      <button type="button" data-go="list"><span data-icon="list"></span>Threads</button>
      <button type="button" data-act="find"><span data-icon="search"></span>Find</button>
      <button type="button" data-act="new"><span data-icon="plus"></span>New</button>
    </nav>
  </div>

  <div class="t-lost" data-lost hidden>
    <div class="t-lost-bar"><a class="t-lost-name" href="/">whysosuresh.com</a></div>
    <div class="t-lost-body">
      <h1 class="t-lost-title" data-lost-title>Nothing here</h1>
      <p class="t-lost-text" data-lost-text>There's nothing at this address.</p>
      <p class="t-lost-text" data-sign-in hidden><a data-sign-in-link href="/threads/">Sign in</a></p>
    </div>
  </div>

  <div class="t-pub" data-public hidden>
    <div class="t-pub-bar"><a href="/">whysosuresh.com</a><a class="t-pub-sign-in" data-public-sign-in href="/threads/" hidden>Sign in</a></div>
    <article class="t-pub-doc" data-public-doc></article>
  </div>

  <p class="t-banner" role="alert" data-banner hidden></p>

  <div class="t-toast" role="status" data-toast hidden>
    <span data-toast-text></span>
    <button type="button" class="t-toast-undo" data-act="undo">Undo <kbd>Z</kbd></button>
    <span class="t-toast-bar" data-toast-bar></span>
  </div>

  <dialog class="t-dialog" data-dialog aria-label="Threads"></dialog>

  <template data-icons>

    <svg class="t-i" data-name="link" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.3-2.3a3 3 0 0 0-4.2-4.2l-.8.8M9.5 6.5a3 3 0 0 0-4.2 0L3 8.8A3 3 0 0 0 7.2 13l.8-.8"/></svg>
    <svg class="t-i" data-name="doc" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5.5L12.5 4.5V14a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V2a.5.5 0 0 1 .5-.5Z"/><path d="M9.5 1.5v3h3M5.5 8h5M5.5 10.5h5"/></svg>
    <svg class="t-i" data-name="x" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>

    <svg class="t-i" data-name="mic" viewBox="0 0 16 16" aria-hidden="true"><rect x="6" y="1.5" width="4" height="8" rx="2"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V15"/></svg>

    <svg class="t-i" data-name="people" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="5.5" r="2.5"/><path d="M1.5 13.5a4.5 4.5 0 0 1 9 0"/><circle cx="11.5" cy="6" r="2"/><path d="M11.2 9.6a3.6 3.6 0 0 1 3.3 3.9"/></svg>
  </template>
</body>
</html>
