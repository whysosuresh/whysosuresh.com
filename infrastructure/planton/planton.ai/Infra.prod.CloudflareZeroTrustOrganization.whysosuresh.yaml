# The account `whysosuresh`'s Zero Trust organization (../../vendors/cloudflare/README.md, "Zero Trust"): the
# team whose sign-in page guards the threads' calls at whysosuresh.com/threads/api. Cloudflare creates it when Zero Trust is
# switched on (row 21's owner step, 2026-11-04), under a random team name; this file gives it the site's name.
# Planton configures it and never creates or deletes it: deleting this resource changes nothing at Cloudflare.
#
# The team domain is the address every sign-in goes through and the issuer the Worker checks on every threads
# request (`ACCESS_TEAM_DOMAIN` in ../../../wrangler.jsonc). Changing it ends every session and breaks the
# Worker's check until wrangler.jsonc follows, so it changes only with both, in one PR.
#
# A seat (the Free plan has 50) is taken by everyone who signs in, invited people included, and given back after a
# month without a sign-in, Cloudflare's shortest; someone who comes back after that simply signs in again.
#
#   planton apply -f Infra.prod.CloudflareZeroTrustOrganization.whysosuresh.yaml --instance planton.ai --org why-so-suresh
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustOrganization
metadata:
  name: whysosuresh # permanent
  org: why-so-suresh
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  accountId: $var/cloudflare-whysosuresh-account-id
  authDomain: whysosuresh.cloudflareaccess.com # required on every write, even when unchanged
  name: whysosuresh # Cloudflare echoes the name on every read, so it is declared to keep the diff empty
  userSeatExpirationInactiveTime: 730h # a month, the least Cloudflare allows
