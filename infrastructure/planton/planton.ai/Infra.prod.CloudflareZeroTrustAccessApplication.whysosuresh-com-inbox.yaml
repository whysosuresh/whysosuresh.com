# The inbox's door: every request to whysosuresh.com/inbox and everything under it (the page and its calls
# under /inbox/api/) meets Access first. The owner signs in with an email code, the recorder sync with its
# service token; anyone else is stopped at Cloudflare's edge and never reaches the site.
#
# `status.outputs.aud` is the application's tag, which Access signs into every request it lets through. The
# Worker checks it on every inbox call (`ACCESS_AUD` in ../../../wrangler.jsonc), so a request Access didn't
# sign for this application is refused even if it slips past the path match.
#
#   planton apply -f Infra.prod.CloudflareZeroTrustAccessApplication.whysosuresh-com-inbox.yaml --instance planton.ai --org why-so-suresh
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustAccessApplication
metadata:
  name: whysosuresh-com-inbox # permanent
  org: why-so-suresh
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  accountId: $var/cloudflare-whysosuresh-account-id
  name: whysosuresh.com inbox
  type: self_hosted
  # A path: Access guards /inbox and every path under it, and nothing else on the site.
  domain: whysosuresh.com/inbox
  sessionDuration: 168h
  # Only the email code: the sign-in page goes straight to it, without a list of methods.
  allowedIdps:
    - valueFrom:
        kind: CloudflareZeroTrustAccessIdentityProvider
        env: prod # Planton stores the environment it resolved; declared to keep the diff empty
        name: one-time-pin
        fieldPath: status.outputs.identity_provider_id
  autoRedirectToIdentity: true
  appLauncherVisible: false
  policies:
    - policy:
        valueFrom:
          kind: CloudflareZeroTrustAccessPolicy
          env: prod
          name: whysosuresh-com-inbox-owner
          fieldPath: status.outputs.policy_id
      precedence: 1
    - policy:
        valueFrom:
          kind: CloudflareZeroTrustAccessPolicy
          env: prod
          name: whysosuresh-com-inbox-sync
          fieldPath: status.outputs.policy_id
      precedence: 2
