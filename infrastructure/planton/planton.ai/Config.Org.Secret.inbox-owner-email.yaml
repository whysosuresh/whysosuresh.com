# The one email address the inbox admits: the owner's own, which the sign-in page sends a one-time code to.
# Metadata only: this repository is public and keeps the address out on purpose, so address scrapers never
# read it here. Its value is set after this record exists, through standard input:
#
#   planton apply -f Config.Org.Secret.inbox-owner-email.yaml --instance planton.ai --org why-so-suresh
#   printf %s '<the address>' | planton secret set inbox-owner-email --string --instance planton.ai --org why-so-suresh
#
# Consumers: the Access policy Infra.prod.CloudflareZeroTrustAccessPolicy.whysosuresh-com-inbox-owner.yaml,
# by `$secret/inbox-owner-email`; and the Worker, through its one copy outside Planton, `INBOX_OWNER_EMAIL` in
# the GitHub environment `production` (README row 27, copied by script as the vendor record says).
apiVersion: config-manager.planton.ai/v1alpha1
kind: Secret
metadata:
  name: inbox-owner-email # the slug is the identity every $secret/ reference uses, so name and slug are one
  slug: inbox-owner-email
  org: why-so-suresh
spec:
  scope: organization # one value for every environment
  description: >-
    The owner's email address, the only person the inbox at whysosuresh.com/inbox admits. Read by the Access
    policy whysosuresh-com-inbox-owner and copied to the GitHub environment `production` as INBOX_OWNER_EMAIL
    for the Worker's own check. Changing it means setting it here, re-applying the policy and copying it again.
  backend: platform-default # Planton's built-in store; a secret's backend can never change
  dataFormat: text # one opaque string
