# The Cloudflare account API token Planton signs in with. Metadata only: the value is never in this repository.
# It is set after this record exists, from the clipboard through standard input, so it never crosses a command
# line, a file or a chat:
#
#   planton apply -f Config.Org.Secret.cloudflare-whysosuresh-account-api-token.yaml --instance planton.ai --org why-so-suresh
#   pbpaste | planton secret set cloudflare-whysosuresh-account-api-token --string --instance planton.ai --org why-so-suresh
apiVersion: config-manager.planton.ai/v1alpha1
kind: Secret
metadata:
  name: cloudflare-whysosuresh-account-api-token # the slug is the identity every $secret/ reference uses, so name and slug are one
  slug: cloudflare-whysosuresh-account-api-token
  org: why-so-suresh
spec:
  scope: organization # one value for every environment
  description: >-
    The account API token `planton-whysosuresh` of the Cloudflare account `whysosuresh` (minted 2026-11-03 in the
    dashboard by the owner; its permissions, custody and re-mint are in ../../vendors/cloudflare/README.md).
    Consumer: Connection.CloudflareProviderConnection.cloudflare-whysosuresh-account and, through it, every
    Cloudflare resource Planton deploys here. A lost or leaked value is re-minted in the dashboard, then set again
    with the command above.
  backend: platform-default # Planton's built-in store, the organization's default; a secret's backend can never change
  dataFormat: text # one opaque string
