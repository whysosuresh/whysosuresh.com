# The key the site signs its answers to Access's sign-in question with (../../../src/evaluate.ts): an RSA private
# key, as a JWK, made on the owner's Mac and never shown. Metadata only: the value is set after this record exists,
# through standard input, by a script that makes the key and never prints it:
#
#   planton apply -f Config.Org.Secret.threads-evaluation-key.yaml --instance planton.ai --org why-so-suresh
#   node -e '<makes the key and writes its JWK to stdout>' | planton secret set threads-evaluation-key --string --instance planton.ai --org why-so-suresh
#
# Consumer: the Worker, through its one copy outside Planton, `THREADS_EVALUATION_KEY` in the GitHub environment
# `production` (README row 31, copied by script as the vendor record says). Its public half is derived by the
# Worker and served at https://whysosuresh.com/api/access/keys, which the members' Access policy names.
apiVersion: config-manager.planton.ai/v1alpha1
kind: Secret
metadata:
  name: threads-evaluation-key # the slug is the identity every $secret/ reference uses, so name and slug are one
  slug: threads-evaluation-key
  org: why-so-suresh
spec:
  scope: organization # one value for every environment
  description: >-
    The RSA private key, as a JWK, that signs whysosuresh.com's answers to Cloudflare Access's question at sign-in
    for invited people. Copied to the GitHub environment `production` as THREADS_EVALUATION_KEY for the Worker.
    Rotating it means setting a new value here, copying it again and re-running the deploy; Access reads the new
    public half from the keys address.
  backend: platform-default # Planton's built-in store; a secret's backend can never change
  dataFormat: text # one opaque string
