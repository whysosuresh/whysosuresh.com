# The whysosuresh.com zone's redirect rules: Cloudflare keeps one ruleset per zone per phase, so every
# redirect on the zone is a rule in this one file. Redirect rules run before the Worker, so a rule here
# wins over the site.
#
# www.whysosuresh.com answers every request with a permanent 301 to the same path and query on the apex,
# where the Worker serves the site. The apex has no rule, so it reaches the Worker. Until the site went live,
# the zone sent every request, apex included, to the YouTube channel; this file's history holds that form,
# and applying it again is the way back.
#
#   planton apply -f Infra.prod.CloudflareRuleset.whysosuresh-com-redirects.yaml --instance planton.ai --org why-so-suresh
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareRuleset
metadata:
  name: whysosuresh-com-redirects
  org: why-so-suresh
  env: prod
  annotations:
    planton.dev/provisioner: tofu
spec:
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      env: prod # Planton stores the environment it resolved; writing it keeps `planton diff` exact
      name: whysosuresh-com
      fieldPath: status.outputs.zone_id
  rulesetKind: zone
  phase: http_request_dynamic_redirect
  name: whysosuresh.com redirects
  rules:
    - ref: www-to-apex
      description: www to the same address on the apex
      expression: 'http.host eq "www.whysosuresh.com"'
      action: redirect
      enabled: true
      actionParameters:
        fromValue:
          targetUrl:
            expression: 'concat("https://whysosuresh.com", http.request.uri.path)'
          statusCode: 301
          preserveQueryString: true
